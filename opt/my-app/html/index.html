<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My App - /opt/my-app</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #f6f7f9; color: #111; margin: 0; }
      .wrap { max-width: 680px; margin: 12vh auto; padding: 32px; background: #fff;
              border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
      h1 { margin: 0 0 8px; color: #0f766e; }
      code { background: #f1f5f9; padding: 2px 6px; border-radius: 6px; }
      ul { line-height: 1.8; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>My App (Production tại /opt)</h1>
      <p>Website tĩnh được cô lập trong phân vùng <code>/opt/my-app/</code>.</p>
      <ul>
        <li>Mã nguồn: <code>/opt/my-app/html</code> (owner <b>devops:www-data</b>)</li>
        <li>Logs: <code>/opt/my-app/logs</code> (www-data ghi được)</li>
      </ul>
      <p>Nginx phục vụ trang này và ghi access/error log trực tiếp vào <code>/opt/my-app/logs/</code>.</p>
    </div>
  </body>
</html>
