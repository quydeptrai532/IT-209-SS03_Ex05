# Bài 5 (Session 03) - Web an toàn tại /opt/my-app
# /etc/nginx/sites-available/my-app.conf
#
# Mã nguồn: /opt/my-app/html   (owner devops:www-data)
# Logs:     /opt/my-app/logs   (group www-data ghi được)

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/my-app/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Ghi log trực tiếp vào phân vùng /opt
    access_log /opt/my-app/logs/access.log;
    error_log  /opt/my-app/logs/error.log;
}
